<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Icons -->

    <link rel="apple-touch-icon" href="/icon-180.png" />

    <!-- ⚠️ THE THEME, BEFORE THE FIRST PIXEL — inline, here, rather than in the
         app. `<html>`'s ground is painted from index.css the moment the
         stylesheet lands, long before the module bundle has parsed, so a
         dark-mode user would otherwise get a pale frame first and the dark one
         a moment later. `createThemeStore` (the SDK) applies the same class at
         import time, which is early but not this early; the store then reads
         the same two keys and agrees.

         Since SDK 0.143 the app key holds this app's OVERRIDE, set in App
         preferences; absent, the app follows the suite-wide choice from Global
         preferences, `universal:color-scheme`. ⚠️ Both fallbacks matter: read
         only the app key and someone who chose Dark globally gets a light first
         frame and then a flip.

         ⚠️ THE APP KEY IS DUPLICATED — `src/stores/themeStore.ts` holds the other
         copy, and renaming one silently puts everybody who chose something here
         back to following global. They are held together by
         `src/lib/theme.test.ts`. Do not "tidy" either away.

         Light is the default (the suite rule), so this only ever ADDS `dark`. -->
    <script>
      try {
        var pref = localStorage.getItem('unisim-compress-theme')
          || localStorage.getItem('universal:color-scheme') || 'light'
        if (pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (e) {
        /* private mode, storage disabled: light, exactly as the store falls back. */
      }
    </script>

    <!-- Primary SEO -->

    <!-- Structured data. The credit James asked for on 2026-09-05 lives in two
         places, and this is the one a search engine can read: the in-app line
         is in the SDK's <AboutAppDialog>, which is a React portal and only
         enters the DOM once somebody opens it, so a crawler never sees it.

         Every value below is taken from THIS FILE's own <title>, description
         and canonical rather than typed again, so the block cannot drift from
         what the page already says about itself. The author matches the app's
         marketing page on unisim.co.uk and points at the same /about-james,
         so both resolve to one person rather than two mentions of a name. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Universal Compress",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web browser",
      "url": "https://opensource.unisim.co.uk/compress/",
      "description": "Compress PDFs, video, images and audio entirely in your browser. Drop any file into the circle and the options adapt to it. Nothing is uploaded — no account, no size cap, no paywall. Open source and works offline.",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "GBP"
      },
      "author": [
        {
          "@type": "Person",
          "name": "James Markey",
          "honorificSuffix": "MBE",
          "jobTitle": "Founder & Director",
          "url": "https://www.unisim.co.uk/about-james"
        },
        {
          "@type": "Organization",
          "name": "UNI·SIM",
          "url": "https://www.unisim.co.uk",
          "subjectOf": {
            "@type": "BlogPosting",
            "name": "Welcome to the UNI·SIM studio",
            "url": "https://www.unisim.co.uk/blog/welcome-to-uni-sim"
          }
        }
      ],
      "provider": {
        "@type": "Organization",
        "name": "UNI·SIM",
        "url": "https://www.unisim.co.uk"
      }
    }
    </script>
  </head>
