<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <!-- Primary SEO -->
    <title>Universal Compress — make any file smaller, without uploading it</title>
    <meta name="description" content="Compress PDFs, video, images and audio entirely in your browser. Drop any file into the circle and the options adapt to it. Nothing is uploaded — no account, no size cap, no paywall. Open source and works offline." />
    <meta name="keywords" content="compress pdf, compress video, compress image, compress mp4, reduce file size, shrink pdf, compress without uploading, offline file compressor, private file compressor, no upload compressor, open source compressor, make file smaller" />
    <meta name="author" content="UNI·SIM" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="canonical" href="https://opensource.unisim.co.uk/compress/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Universal Compress" />
    <meta property="og:url" content="https://opensource.unisim.co.uk/compress/" />
    <meta property="og:title" content="Universal Compress — make any file smaller, without uploading it" />
    <meta property="og:description" content="Drop a PDF, video, image or audio file into the circle and the options adapt to it. Everything is compressed in your browser — your files never leave your device. 100% free, every feature, no paywalls." />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Universal Compress — make any file smaller, without uploading it" />
    <meta name="twitter:description" content="Drop a PDF, video, image or audio file into the circle and the options adapt to it. Everything is compressed in your browser — your files never leave your device." />
    <!-- Structured data. The credit James asked for on 2026-09-05 lives in two
         places, and this is the one a search engine can read: the in-app line
         is in the SDK's <AboutAppDialog>, which is a React portal and only
         enters the DOM once somebody opens it, so a crawler never sees it.

         Every value below is taken from THIS FILE's own <title>, description
         and canonical rather than typed again, so the block cannot drift from
         what the page already says about itself. The author matches the app's
         marketing page on unisim.co.uk and points at the same /about-james,
         so both resolve to one person rather than two mentions of a name. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Universal Compress",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web browser",
      "url": "https://opensource.unisim.co.uk/compress/",
      "description": "Compress PDFs, video, images and audio entirely in your browser. Drop any file into the circle and the options adapt to it. Nothing is uploaded — no account, no size cap, no paywall. Open source and works offline.",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "GBP"
      },
      "author": [
        {
          "@type": "Person",
          "name": "James Markey",
          "honorificSuffix": "MBE",
          "jobTitle": "Founder & Director",
          "url": "https://www.unisim.co.uk/about-james"
        },
        {
          "@type": "Organization",
          "name": "UNI·SIM",
          "url": "https://www.unisim.co.uk",
          "subjectOf": {
            "@type": "BlogPosting",
            "name": "Welcome to the UNI·SIM studio",
            "url": "https://www.unisim.co.uk/blog/welcome-to-uni-sim"
          }
        }
      ],
      "provider": {
        "@type": "Organization",
        "name": "UNI·SIM",
        "url": "https://www.unisim.co.uk"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
